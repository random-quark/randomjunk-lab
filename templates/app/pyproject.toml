[project]
# Stable package name lets every scaffold use the same reproducible lockfile.
name = "lab-experiment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.uv]
package = false
