[project]
# Stable package name lets every scaffold use the same reproducible lockfile.
name = "lab-experiment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<9", "playwright>=1.50,<2", "httpx>=0.28,<1", "pytest-xdist>=3,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real timing or external integration; not skipped by default"]
