<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Refresh your lab guide</title><style>body{background:#151817;color:#edf2ec;font:18px/1.6 system-ui;margin:10vh auto;padding:24px;max-width:600px}a{color:#d3ee9c}</style></head><body><h1>Updating your lab guide…</h1><p id="status" role="status">Replacing the old saved instructions. Your invitation stays with you.</p><script type="module">
const invitation = location.hash;
const timeout = (promise, ms) => Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))]);
try {
  if ('serviceWorker' in navigator) {
    const reg = await navigator.serviceWorker.register('/sw.js', {updateViaCache: 'none'});
    await reg.update();
    const worker = reg.installing || reg.waiting || reg.active;
    if (worker && worker.state !== 'activated') await timeout(new Promise(resolve => {
      worker.addEventListener('statechange', () => { if (worker.state === 'activated') resolve(); });
    }), 20000);
    if (navigator.serviceWorker.controller !== worker) await timeout(new Promise(resolve => {
      navigator.serviceWorker.addEventListener('controllerchange', resolve, {once: true});
    }), 10000);
    await timeout(new Promise((resolve, reject) => {
      const channel = new MessageChannel();
      channel.port1.onmessage = event => { channel.port1.close(); event.data === 'network-first-v1' ? resolve() : reject(new Error('old worker')); };
      navigator.serviceWorker.controller.postMessage('welcome-version', [channel.port2]);
    }), 5000);
  }
  location.replace('/' + invitation);
} catch {
  document.getElementById('status').textContent = 'The update could not finish. Close previous private windows, then open your original invitation in a new private window. Your server access has not changed.';
}
</script></body></html>
