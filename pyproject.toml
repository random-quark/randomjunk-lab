[project]
name = "lab-server-review"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<9", "fastapi>=0.115,<1", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "sqlalchemy>=2.0,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
